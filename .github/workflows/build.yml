name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            artifact: re-search-accessory-windows-x64
          - os: ubuntu-24.04
            name: linux-x64
            artifact: re-search-accessory-linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build desktop app + server
        working-directory: backend
        run: cargo build --release --bin re-search-accessory-app --bin re-search-accessory-backend

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "backend\target\release\re-search-accessory-app.exe" "$stage\re-search-accessory.exe"
          Copy-Item "backend\target\release\re-search-accessory-backend.exe" "$stage\re-search-accessory-server.exe"
          Copy-Item "docs\PORTABLE.txt" "$stage\README.txt"

          # MSVC links WebView2Loader statically; the GNU toolchain needs the DLL.
          $bytes = [System.IO.File]::ReadAllBytes("$stage\re-search-accessory.exe")
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($ascii.Contains("WebView2Loader.dll")) {
            $dll = Get-ChildItem "backend\target\release\build\webview2-com-sys-*\out\x64\WebView2Loader.dll" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $dll) { $dll = Get-Item "backend\target\release\WebView2Loader.dll" -ErrorAction SilentlyContinue }
            if (-not $dll) { throw "re-search-accessory.exe needs WebView2Loader.dll but it was not found" }
            Copy-Item $dll.FullName "$stage\WebView2Loader.dll"
          }

          Compress-Archive -Path "$stage\*" -DestinationPath "re-search-accessory-windows-x64.zip" -Force
          Get-ChildItem "re-search-accessory-*.zip" | Format-Table Name, Length

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p stage
          cp backend/target/release/re-search-accessory-app stage/re-search-accessory
          cp backend/target/release/re-search-accessory-backend stage/re-search-accessory-server
          cp docs/PORTABLE.txt stage/README.txt
          chmod +x stage/*
          tar -C stage -czf "re-search-accessory-linux-x64.tar.gz" .
          ls -lh re-search-accessory-*.tar.gz

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            re-search-accessory-*.zip
            re-search-accessory-*.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
